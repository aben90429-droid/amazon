<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Topazion Sign In</title>
  <link rel="icon" type="image/jpeg" href="images/topazion-favicon.jpg">
  <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <p class="eyebrow">Topazion account</p>
      <h1 id="auth-title">Sign in</h1>
      <p class="intro" id="auth-intro">Use your name and password to open your own cart.</p>

      <form id="login-form" class="auth-form">
        <label>Username <input name="username" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button id="sign-in-button" type="submit">Sign in</button>
      </form>

      <form id="signup-form" class="auth-form hidden" style="display: none;">
        <label>Display name <input name="displayName" autocomplete="name" required></label>
        <label>Username <input name="username" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" autocomplete="new-password" required></label>
        <button id="sign-up-button" type="submit">Create account</button>
      </form>

      <p class="message" id="message" role="alert"></p>
      <button id="toggle-auth-mode" class="text-button" type="button">Create an account</button>
      <a href="amazon.html">Return to store</a>
    </section>
  </main>
  <script type="module" src="scripts/login.js"></script>
</body>
</html>
