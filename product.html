<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product | Topazion</title>
  <link rel="stylesheet" href="styles/shared/general.css">
  <link rel="stylesheet" href="styles/shared/amazon-header.css">
  <link rel="stylesheet" href="styles/pages/product.css">
</head>
<body>
  <div class="amazon-header">
    <div class="amazon-header-left-section"><a href="amazon.html" class="header-link"><img class="amazon-logo" src="images/topazion-header-mark.png" alt="Topazion"><img class="amazon-mobile-logo" src="images/topazion-header-mark.png" alt="Topazion"></a></div>
    <div class="amazon-header-middle-section"><input class="search-bar" type="search" placeholder="Search products" aria-label="Search products"><button class="search-button" type="button" aria-label="Search"><img class="search-icon" src="images/icons/search-icon.png" alt=""></button></div>
    <div class="amazon-header-right-section"><a class="orders-link header-link" href="orders.html">Returns &amp; Orders</a><a class="orders-link header-link" href="wishlist.html">Wishlist</a><a class="cart-link header-link" href="checkout.html"><img class="cart-icon" src="images/icons/cart-icon.png" alt="Cart"><div class="cart-quantity js-cart-quantity">0</div><div class="cart-text">Cart</div></a></div>
  </div>
  <main class="product-page"><a href="amazon.html" class="back-link">Back to products</a><section class="product-detail" aria-live="polite"><p>Loading product...</p></section><section class="reviews-section" aria-labelledby="reviews-title"><h2 id="reviews-title">Customer reviews</h2><div class="review-list"></div><form class="review-form" hidden><h3>Write a review</h3><label>Rating <select name="rating" required><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select></label><label>Your review <textarea name="review" maxlength="1000" required></textarea></label><button class="button-primary" type="submit">Submit review</button><p class="review-message" role="alert"></p></form></section></main>
  <script type="module" src="scripts/product.js"></script>
</body>
</html>
