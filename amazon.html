<!DOCTYPE html>
<html>

<head>
  <title>Topazion</title>
  <link rel="icon" type="image/jpeg" href="images/topazion-favicon.jpg">

  <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Load a font called Roboto from Google Fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Here are the CSS files for this page. -->
  <link rel="stylesheet" href="styles/shared/general.css">
  <link rel="stylesheet" href="styles/shared/amazon-header.css">
  <link rel="stylesheet" href="styles/pages/amazon.css">
</head>

<body>
  <div class="amazon-header">
    <div class="amazon-header-left-section">
      <a href="amazon.html" class="header-link">
        <img class="amazon-logo" src="images/topazion-header-mark.png" alt="Topazion">
        <img class="amazon-mobile-logo" src="images/topazion-header-mark.png" alt="Topazion">
      </a>
    </div>

    <div class="amazon-header-middle-section">
      <input class="search-bar" type="text" placeholder="Search">

      <button class="search-button">
        <img class="search-icon" src="images/icons/search-icon.png">
      </button>
    </div>

    <div class="amazon-header-right-section">
      <details class="account-menu">
        <summary class="orders-link header-link js-account-name">Sign in</summary>
        <div class="account-dropdown">
          <button class="sign-out-button" type="button">Sign out</button>
        </div>
      </details>
      <a class="orders-link header-link" href="orders.html">
        <span class="returns-text">Returns</span>
        <span class="orders-text">& Orders</span>
      </a>
      <a class="orders-link header-link" href="wishlist.html">Wishlist</a>

      <a class="cart-link header-link" href="checkout.html">
        <img class="cart-icon" src="images/icons/cart-icon.png">
        <div class="cart-quantity js-cart-quantity js-cart-quantity2">0</div>
        <div class="cart-text">Cart</div>
      </a>
    </div>
  </div>

  <div class="main">
    <section class="catalog-toolbar" aria-label="Product controls">
      <div class="catalog-heading">
        <h1>Shop all products</h1>
        <span class="results-count" aria-live="polite"></span>
      </div>
      <div class="catalog-controls">
        <label>Category
          <select class="category-filter" aria-label="Filter by category">
            <option value="all">All categories</option>
          </select>
        </label>
        <label>Sort by
          <select class="sort-select" aria-label="Sort products">
            <option value="featured">Featured</option>
            <option value="price-low">Price: Low to high</option>
            <option value="price-high">Price: High to low</option>
            <option value="rating">Customer rating</option>
            <option value="newest">Newest arrivals</option>
          </select>
        </label>
      </div>
    </section>
    <div class="products-grid js-product-grid">



    </div>
    <nav class="pagination" aria-label="Product pages"></nav>
  </div>

  <!-- Load data scripts first -->

  <script type="module" src="scripts/amazon.js"></script>
</body>

</html>
