<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wishlist | Topazion</title>
  <link rel="stylesheet" href="styles/shared/general.css">
  <link rel="stylesheet" href="styles/shared/amazon-header.css">
  <link rel="stylesheet" href="styles/pages/amazon.css">
</head>
<body>
  <div class="amazon-header">
    <div class="amazon-header-left-section"><a href="amazon.html" class="header-link"><img class="amazon-logo" src="images/topazion-header-mark.png" alt="Topazion"><img class="amazon-mobile-logo" src="images/topazion-header-mark.png" alt="Topazion"></a></div>
    <div class="amazon-header-middle-section"><input class="search-bar" type="search" placeholder="Search products" aria-label="Search products"><button class="search-button" type="button" aria-label="Search"><img class="search-icon" src="images/icons/search-icon.png" alt=""></button></div>
    <div class="amazon-header-right-section"><a class="orders-link header-link" href="orders.html">Returns &amp; Orders</a><a class="cart-link header-link" href="checkout.html"><img class="cart-icon" src="images/icons/cart-icon.png" alt="Cart"><div class="cart-quantity js-cart-quantity">0</div><div class="cart-text">Cart</div></a></div>
  </div>
  <main class="main wishlist-page"><h1 class="wishlist-title">Your wishlist</h1><section class="wishlist-grid" aria-live="polite"><p>Loading wishlist...</p></section></main>
  <script type="module" src="scripts/wishlist.js"></script>
</body>
</html>
