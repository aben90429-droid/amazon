<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Topazion People</title>
  <link rel="icon" type="image/jpeg" href="images/topazion-favicon.jpg">
  <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
  <main class="people-shell">
    <header class="people-header">
      <div>
        <p class="eyebrow">Topazion / people</p>
        <h1>Who is signed in</h1>
        <p class="intro">Every person has a separate cart stored in the backend.</p>
      </div>
      <div class="header-actions"><span id="current-user"></span><button id="logout-button" type="button">Sign out</button></div>
    </header>
    <p class="message" id="message" role="alert"></p>
    <section id="people-list" class="people-list"></section>
  </main>
  <script type="module" src="scripts/people.js"></script>
</body>
</html>
