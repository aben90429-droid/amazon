<!DOCTYPE html>
<html>

<head>
  <title>Topazion Checkout</title>
  <link rel="icon" type="image/jpeg" href="images/topazion-favicon.jpg">

  <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Load a font called Roboto from Google Fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Here are the CSS files for this page. -->
  <link rel="stylesheet" href="styles/shared/general.css">
  <link rel="stylesheet" href="styles/pages/checkout/checkout-header.css">
  <link rel="stylesheet" href="styles/pages/checkout/checkout.css">
</head>

<body>
  <div class="checkout-header">
    <div class="header-content">
      <div class="checkout-header-left-section">
        <a href="amazon.html">
          <img class="amazon-logo" src="images/topazion-header-mark.png" alt="Topazion">
          <img class="amazon-mobile-logo" src="images/topazion-header-mark.png" alt="Topazion">
        </a>
      </div>

      <div class="checkout-header-middle-section">
        Checkout (<a class="return-to-home-link js-return-to-home-link" href="amazon.html"></a>)
      </div>

      <div class="checkout-header-right-section">
        <img src="images/icons/checkout-lock-icon.png">
      </div>
    </div>
  </div>

  <div class="main">
    <div class="page-title">Review your order</div>

    <div class="checkout-grid">
      <div class="order-summary js-order-summary">
      </div>

      <div>
        <form class="checkout-information" id="checkout-information">
          <h2>Customer information</h2>
          <label>Full name <input name="customerName" autocomplete="name" maxlength="120" required></label>
          <label>Email <input name="customerEmail" type="email" autocomplete="email" maxlength="200" required></label>
          <label>Shipping address <textarea name="shippingAddress" autocomplete="street-address" maxlength="500" required></textarea></label>
          <h2>Payment</h2>
          <label class="payment-choice"><input type="radio" name="paymentMethod" value="demo" checked> Demo payment (no real charge)</label>
          <p class="checkout-note">Real card payments will be connected later through a payment provider.</p>
        </form>
        <div class="payment-summary js-payment-summary">

        </div>
      </div>
    </div>
  </div>
  <script type="module" src="scripts/checkout.js"></script>
</body>

</html>
